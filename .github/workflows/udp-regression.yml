name: UDP regression

# Scans loopback UDP ports to check probe sending, retries and how explicit
# rejection ends a scan. The default test run skips these socket tests
# (they are #[ignore]d), so they only run when this workflow is started by hand.
#
# The Rust tests use loopback listeners. The Python tests need real ICMP
# errors and iptables REJECT rules: `unshare --net` runs them in a private
# network namespace, which keeps the rules off the runner, and both it and
# iptables need root, hence sudo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udp-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Loopback socket tests
        run: cargo test --locked --lib udp_socket_tests -- --ignored

      - name: ICMP rejection tests
        run: |
          cargo build --locked
          sudo unshare --net python3 .github/udp-regression/udp_rejection.py target/debug/rustscan
